<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener Microservice</title>
    <link rel="stylesheet" href="/public/style.css">
  </head>
  <body>
    <h1>URL Shortener Microservice</h1>
    <main>
      <section>
        <form action="/api/shorturl" method="POST">
          <fieldset>
            <legend>URL Shortener</legend>
            <label for="url_input">URL:</label>
            <input id="url_input" type="text" name="url" placeholder="https://www.freecodecamp.org/" required>
            <input type="submit" value="POST URL">
          </fieldset>
        </form>
      </section>
      <section>
        <h3>Example Usage:</h3>
        <code>[project_url]/api/shorturl/3</code>
        <h3>Example Output:</h3>
        <code>
          {
            "original_url": "https://www.freecodecamp.org/",
            "short_url": 3
          }
        </code>
      </section>
    </main>
    <footer>
      <p>By <a href="https://www.freecodecamp.org/" target="_blank">freeCodeCamp</a></p>
    </footer>
  </body>
</html>
